ekf_filter_node:
  ros__parameters:

    frequency: 30.0
    sensor_timeout: 0.2

    two_d_mode: true

    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # ==========================================
    # MD200T actual wheel odometry
    #
    # vx   = actual forward velocity
    # vyaw = actual differential wheel yaw rate
    # ==========================================

    odom0: /odom

    odom0_config:
      [
        false, false, false,
        false, false, false,
        true,  false, false,
        false, false, false,
        false, false, false
      ]

    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

    # ==========================================
    # iAHRS
    #
    # For now use gyro Z only.
    # Absolute yaw is intentionally disabled.
    # ==========================================

    imu0: /imu/data

    imu0_config:
      [
        false, false, false,
        false, false, true,
        false, false, false,
        false, false, true,
        false, false, false
      ]

    imu0_queue_size: 10
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true

    imu0_remove_gravitational_acceleration: true

    use_control: false
